<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
body{
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background-color: #f9f9f9; /* Agar background halka sa color dena chahein */
}
.spinner{
    width: 100px;
    height: 100px;
    border: 8px dotted black;
    border-radius: 50%;
    animation: spin 3s linear infinite;
}
@keyframes spin{
    0%{
        transform: rotate(0deg);
    }
    100%{
        transform: rotate(360deg);
    }
}
</style>

<body>
    <div class="spinner"></div>
</body>
</html>
